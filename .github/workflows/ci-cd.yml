name: SmartShop CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

    - name: Check formatting with black
      run: black --check .

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run unit tests
      run: python -m pytest tests/

  deployment-validation:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate Docker Compose config
      run: docker compose config

    - name: Build API runtime image
      run: docker build --target runtime -t smartshop-api:ci .

  # CD: push a versioned image to GHCR on every merge to main.
  # Deployments should pin the sha-<commit> tag, never :latest.
  publish-image:
    runs-on: ubuntu-latest
    needs: deployment-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set image metadata
      id: meta
      run: |
        REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "image=ghcr.io/${REPO_LOWER}/smartshop-api" >> "$GITHUB_OUTPUT"
        echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

    - name: Build and push runtime image
      run: |
        docker build --target runtime \
          -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}" \
          -t "${{ steps.meta.outputs.image }}:latest" .
        docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}"
        docker push "${{ steps.meta.outputs.image }}:latest"
