apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartshop-api
  labels:
    app: smartshop-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smartshop-api
  template:
    metadata:
      labels:
        app: smartshop-api
    spec:
      containers:
        - name: api
          image: smartshop-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartshop-api-secret
                  key: redis-password
                  optional: true
            - name: SMARTSHOP_ENV
              value: prod
            - name: QDRANT_HOST
              value: qdrant
            - name: QDRANT_PORT
              value: "6333"
            - name: QDRANT_COLLECTION_NAME
              value: products
            - name: SMARTSHOP_EMBEDDING_BACKEND
              value: hashing
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: SMARTSHOP_CORS_ORIGINS
              value: https://frontend.smartshop.example
            - name: SMARTSHOP_JWT_ISSUER
              value: https://issuer.smartshop.example
            - name: SMARTSHOP_JWT_AUDIENCE
              value: smartshop-api
            - name: SMARTSHOP_JWKS_URL
              value: https://issuer.smartshop.example/.well-known/jwks.json
            - name: SMARTSHOP_JWT_ALGORITHMS
              value: RS256
            - name: SMARTSHOP_UPLOAD_DIR
              value: /app/data/uploads/catalog
            - name: SMARTSHOP_ETL_OUTPUT_DIR
              value: /app/data/processed/catalog_uploads
            - name: SMARTSHOP_ETL_OUTPUT_FORMAT
              value: parquet
            - name: SMARTSHOP_ETL_COMMAND
              valueFrom:
                secretKeyRef:
                  name: smartshop-api-secret
                  key: etl-command
                  optional: true
            - name: SMARTSHOP_AGENT_USE_LLM
              value: auto
            - name: SMARTSHOP_OPENAI_MODEL
              value: o4-mini
            - name: SMARTSHOP_POLICY_SOURCE_PATH
              value: /app/data/policies/smartshop_policy.md
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smartshop-api-secret
                  key: openai-api-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
