apiVersion: v1
kind: Service
metadata:
  name: smartshop-api
  labels:
    app: smartshop-api
spec:
  # Fronted by the Ingress (k8s/ingress.yaml); switch back to LoadBalancer if
  # you expose the API without an ingress controller.
  type: ClusterIP
  selector:
    app: smartshop-api
  ports:
    - name: http
      port: 80
      targetPort: http
