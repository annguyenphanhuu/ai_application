services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${SMARTSHOP_API_BUILD_TARGET:-runtime}
    image: smartshop-api:latest
    container_name: smartshop-api
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SMARTSHOP_ENV: ${SMARTSHOP_ENV:-dev}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION_NAME: products
      SMARTSHOP_EMBEDDING_BACKEND: ${SMARTSHOP_EMBEDDING_BACKEND:-hashing}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SMARTSHOP_CORS_ORIGINS: ${SMARTSHOP_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
      SMARTSHOP_JWT_SECRET: ${SMARTSHOP_JWT_SECRET:-dev-smartshop-secret}
      SMARTSHOP_JWT_ISSUER: ${SMARTSHOP_JWT_ISSUER:-}
      SMARTSHOP_JWT_AUDIENCE: ${SMARTSHOP_JWT_AUDIENCE:-}
      SMARTSHOP_JWKS_URL: ${SMARTSHOP_JWKS_URL:-}
      SMARTSHOP_JWT_ALGORITHMS: ${SMARTSHOP_JWT_ALGORITHMS:-RS256}
      SMARTSHOP_UPLOAD_DIR: /app/data/uploads/catalog
      SMARTSHOP_ETL_OUTPUT_DIR: /app/data/processed/catalog_uploads
      SMARTSHOP_ETL_OUTPUT_FORMAT: ${SMARTSHOP_ETL_OUTPUT_FORMAT:-parquet}
      SMARTSHOP_ETL_SPARK_MASTER: ${SMARTSHOP_ETL_SPARK_MASTER:-local[*]}
      SMARTSHOP_ETL_COMMAND: ${SMARTSHOP_ETL_COMMAND:-}
      SMARTSHOP_AGENT_USE_LLM: ${SMARTSHOP_AGENT_USE_LLM:-auto}
      SMARTSHOP_OPENAI_MODEL: ${SMARTSHOP_OPENAI_MODEL:-o4-mini}
      SMARTSHOP_POLICY_SOURCE_PATH: /app/data/policies/smartshop_policy.md
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Phase 10: Langfuse LLM observability (set in .env to enable)
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    volumes:
      - upload-data:/app/data/uploads/catalog
      - processed-data:/app/data/processed/catalog_uploads
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      kafka:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  vector-indexer:
    profiles: ["indexer"]
    build:
      context: .
      dockerfile: Dockerfile
      target: vector-indexer
    image: smartshop-vector-indexer:latest
    container_name: smartshop-vector-indexer
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION_NAME: products
      SMARTSHOP_EMBEDDING_BACKEND: ${SMARTSHOP_INDEX_EMBEDDING_BACKEND:-hashing}
      SMARTSHOP_VECTOR_SIZE: ${SMARTSHOP_VECTOR_SIZE:-384}
    volumes:
      - ./data/processed:/app/data/processed:ro
    depends_on:
      qdrant:
        condition: service_started
    command:
      - python
      - -m
      - src.vector_store
      - index
      - --input-path
      - ${SMARTSHOP_VECTOR_INPUT_PATH:-/app/data/processed/products_processed}
      - --collection-name
      - ${QDRANT_COLLECTION_NAME:-products}
      - --embedding-backend
      - ${SMARTSHOP_INDEX_EMBEDDING_BACKEND:-hashing}
      - --embedding-model
      - ${SMARTSHOP_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - --vector-size
      - ${SMARTSHOP_VECTOR_SIZE:-384}
      - --qdrant-host
      - qdrant
      - --qdrant-port
      - "6333"

  redis:
    image: redis:7-alpine
    container_name: smartshop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: smartshop-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.2
    container_name: smartshop-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Phase 10: Prometheus – scrapes /metrics từ smartshop-api
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: smartshop-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.enable-lifecycle"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Phase 10: Grafana – dashboard visualisation (http://localhost:3000)
  # Default credentials: admin / admin (change via GF_SECURITY_ADMIN_PASSWORD)
  # -------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.3
    container_name: smartshop-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/smartshop_dashboard.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  upload-data:
  processed-data:
  redis-data:
  qdrant-data:
  kafka-data:
  prometheus-data:
  grafana-data:
